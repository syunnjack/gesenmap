name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/gesenmap.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # これまで public/ しか送っていなかったため、コントローラ・ビュー・
      # マイグレーション・シーダーの変更が本番に反映されていなかった。
      # .env・vendor・storage はサーバー側のものを使うので送らない（--delete もしない）。
      - name: Deploy application code via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr
            --exclude=".git" --exclude=".github" --exclude="node_modules"
            --exclude="public" --exclude="vendor" --exclude="storage"
            --exclude="tests" --exclude=".env" --exclude="bootstrap/cache"
            --exclude="scripts/.cache"
          path: ./
          remote_path: /home/xs501620/gesenmap.jp/app/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: '10022'
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run migrations and seed via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/xs501620/gesenmap.jp/app
            PHP=/opt/php-8.3.30/bin/php
            $PHP artisan migrate --force
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
            # 公式サイトで確認した店舗データ。slug をキーにした upsert なので毎回流してよい。
            # キャッシュ更新のあとに置き、ここで失敗しても配置済みのコードは動く状態にしておく。
            $PHP -d memory_limit=512M artisan db:seed --class=GameCenterOfficialSeeder --force
